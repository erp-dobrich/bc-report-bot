name: Sync Published Version

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Get Chrome Web Store token
        id: auth
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          R=$(curl -fsS https://oauth2.googleapis.com/token \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token")
          TOKEN=$(echo "$R" | jq -r '.access_token // empty')
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Read published version
        id: store
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          R=$(curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:fetchStatus")
          echo "$R" | jq .
          STATE=$(echo "$R" | jq -r '.publishedItemRevisionStatus.state // empty')
          VERSION=$(echo "$R" | jq -r '[.publishedItemRevisionStatus.distributionChannels[]?.crxVersion] | map(select(. != null and . != "")) | first // empty')
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Worker latestVersion
        if: steps.store.outputs.version != '' && (steps.store.outputs.state == 'PUBLISHED' || steps.store.outputs.state == 'PUBLISHED_TO_TESTERS')
        shell: bash
        env:
          VERSION: ${{ steps.store.outputs.version }}
          ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
        run: |
          echo "Published version: $VERSION"
          curl -fsS \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -X PUT \
            -d "{\"latestVersion\":\"$VERSION\"}" \
            "https://bot-config.erp-admin.workers.dev/config" | jq .