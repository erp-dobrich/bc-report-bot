name: Publish Chrome Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        shell: bash
        run: |
          VERSION=$(node -p "require('./frontend/manifest.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "Manifest: $VERSION"
          echo "Tag:      $TAG"
          test "$VERSION" = "$TAG"

      - name: Build frontend ZIP
        shell: bash
        run: |
          cd frontend
          zip -qr ../frontend-upload.zip .

      - name: Get Chrome Web Store token
        id: auth
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          R=$(curl -fsS https://oauth2.googleapis.com/token \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token")
          TOKEN=$(echo "$R" | jq -r '.access_token // empty')
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload package
        id: upload
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          R=$(curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" \
            -X POST \
            --data-binary @frontend-upload.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:upload")
          echo "$R" | jq .
          STATE=$(echo "$R" | jq -r '.uploadState // empty')
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Wait for upload
        if: steps.upload.outputs.state == 'IN_PROGRESS'
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          for i in {1..30}; do
            R=$(curl -fsS \
              -H "Authorization: Bearer $TOKEN" \
              "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:fetchStatus")
            STATE=$(echo "$R" | jq -r '.lastAsyncUploadState // empty')
            echo "Upload state: $STATE"
            [ "$STATE" = "SUCCEEDED" ] && exit 0
            [ "$STATE" = "FAILED" ] && { echo "$R" | jq .; exit 1; }
            sleep 10
          done
          echo "Upload timeout"
          exit 1

      - name: Submit for review / publish
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{}' \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:publish" | jq .